# dune-atreides - the shoreline of two worlds
# add to tmux.conf: source-file ~/.config/tmux/dune-atreides.conf

set -g status-style "bg=#1E2938,fg=#C9B58B"
set -g status-left-style "fg=#649CD6,bold"
set -g status-right-style "fg=#C9B58B"
setw -g window-status-style "fg=#7C8899"
setw -g window-status-current-style "bg=#2C3B4D,fg=#EAD9B4,bold"
setw -g window-status-activity-style "fg=#DDB05E"
setw -g window-status-bell-style "fg=#CB6854"

set -g pane-border-style "fg=#2C3B4D"
set -g pane-active-border-style "fg=#649CD6"

set -g message-style "bg=#1E2938,fg=#EAD9B4"
set -g message-command-style "bg=#1E2938,fg=#EAD9B4"
set -g mode-style "bg=#2C3B4D,fg=#EAD9B4"
set -g copy-mode-match-style "bg=#2C3B4D,fg=#EAD9B4"
set -g copy-mode-current-match-style "bg=#DDB05E,fg=#141B2A"

set -g display-panes-colour "#7C8899"
set -g display-panes-active-colour "#649CD6"
setw -g clock-mode-colour "#649CD6"
