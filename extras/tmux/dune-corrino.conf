# dune-corrino - the golden lion throne
# add to tmux.conf: source-file ~/.config/tmux/dune-corrino.conf

set -g status-style "bg=#2A1C22,fg=#CFBC96"
set -g status-left-style "fg=#EFB63B,bold"
set -g status-right-style "fg=#CFBC96"
setw -g window-status-style "fg=#9A8781"
setw -g window-status-current-style "bg=#3A2730,fg=#F2E2B8,bold"
setw -g window-status-activity-style "fg=#D4A63F"
setw -g window-status-bell-style "fg=#CE5B6B"

set -g pane-border-style "fg=#3A2730"
set -g pane-active-border-style "fg=#EFB63B"

set -g message-style "bg=#2A1C22,fg=#F2E2B8"
set -g message-command-style "bg=#2A1C22,fg=#F2E2B8"
set -g mode-style "bg=#5A4526,fg=#F2E2B8"
set -g copy-mode-match-style "bg=#5A4526,fg=#F2E2B8"
set -g copy-mode-current-match-style "bg=#D4A63F,fg=#1D1318"

set -g display-panes-colour "#9A8781"
set -g display-panes-active-colour "#EFB63B"
setw -g clock-mode-colour "#EFB63B"
