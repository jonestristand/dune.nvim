# dune-fremen - the desert hides its life
# add to tmux.conf: source-file ~/.config/tmux/dune-fremen.conf

set -g status-style "bg=#272117,fg=#C6B287"
set -g status-left-style "fg=#5D9BC8,bold"
set -g status-right-style "fg=#C6B287"
setw -g window-status-style "fg=#928463"
setw -g window-status-current-style "bg=#362E20,fg=#E6D5A9,bold"
setw -g window-status-activity-style "fg=#D2A855"
setw -g window-status-bell-style "fg=#CC6341"

set -g pane-border-style "fg=#362E20"
set -g pane-active-border-style "fg=#5D9BC8"

set -g message-style "bg=#272117,fg=#E6D5A9"
set -g message-command-style "bg=#272117,fg=#E6D5A9"
set -g mode-style "bg=#362E20,fg=#E6D5A9"
set -g copy-mode-match-style "bg=#362E20,fg=#E6D5A9"
set -g copy-mode-current-match-style "bg=#D2A855,fg=#1B1710"

set -g display-panes-colour "#928463"
set -g display-panes-active-colour "#5D9BC8"
setw -g clock-mode-colour "#5D9BC8"
