# dune-harkonnen - the black sun (hard monochrome)
# add to tmux.conf: source-file ~/.config/tmux/dune-harkonnen.conf

set -g status-style "bg=#1B1B1E,fg=#C9C7C2"
set -g status-left-style "fg=#7E99B4,bold"
set -g status-right-style "fg=#C9C7C2"
setw -g window-status-style "fg=#7E7D82"
setw -g window-status-current-style "bg=#29292E,fg=#EEEDEA,bold"
setw -g window-status-activity-style "fg=#C4AE62"
setw -g window-status-bell-style "fg=#D05837"

set -g pane-border-style "fg=#29292E"
set -g pane-active-border-style "fg=#7E99B4"

set -g message-style "bg=#1B1B1E,fg=#EEEDEA"
set -g message-command-style "bg=#1B1B1E,fg=#EEEDEA"
set -g mode-style "bg=#29292E,fg=#EEEDEA"
set -g copy-mode-match-style "bg=#29292E,fg=#EEEDEA"
set -g copy-mode-current-match-style "bg=#C4AE62,fg=#111113"

set -g display-panes-colour "#7E7D82"
set -g display-panes-active-colour "#7E99B4"
setw -g clock-mode-colour "#7E99B4"
