<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1E2938"/>
      <stop offset="55%" stop-color="#141B2A"/>
      <stop offset="100%" stop-color="#0D121D"/>
    </radialGradient>
    <linearGradient id="duneBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B99441"/>
      <stop offset="100%" stop-color="#7A5A24"/>
    </linearGradient>
    <linearGradient id="duneMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5913A"/>
      <stop offset="100%" stop-color="#9C5B1E"/>
    </linearGradient>
    <linearGradient id="duneFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9B58B"/>
      <stop offset="100%" stop-color="#8A6A38"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAD9B4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EAD9B4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="196"/>
    </clipPath>
    <mask id="crescent">
      <circle cx="340" cy="152" r="56" fill="white"/>
      <circle cx="318" cy="134" r="50" fill="black"/>
    </mask>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0D121D"/>

  <!-- medallion interior -->
  <circle cx="256" cy="256" r="196" fill="url(#sky)"/>

  <g clip-path="url(#disc)">
    <!-- stars -->
    <g fill="#EAD9B4">
      <circle cx="150" cy="120" r="3"/>
      <circle cx="112" cy="188" r="2"/>
      <circle cx="210" cy="90" r="2"/>
      <circle cx="256" cy="150" r="2.5"/>
      <circle cx="96" cy="256" r="2.5"/>
      <circle cx="185" cy="160" r="1.6"/>
      <circle cx="300" cy="98" r="1.6"/>
      <circle cx="140" cy="228" r="1.6"/>
      <circle cx="228" cy="196" r="1.6"/>
      <circle cx="404" cy="230" r="2"/>
      <circle cx="370" cy="110" r="1.6"/>
    </g>

    <!-- moon glow -->
    <circle cx="340" cy="152" r="105" fill="url(#moonGlow)"/>

    <!-- crescent moon -->
    <circle cx="340" cy="152" r="56" fill="#EAD9B4" mask="url(#crescent)"/>

    <!-- back dune -->
    <path d="M 40 342
             C 130 268 210 268 300 322
             C 360 358 420 366 480 350
             L 480 470 L 40 470 Z"
          fill="url(#duneBack)"/>
    <!-- back dune crest line -->
    <path d="M 40 342 C 130 268 210 268 300 322"
          fill="none" stroke="#EAD9B4" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>

    <!-- mid dune -->
    <path d="M 20 420
             C 120 336 230 330 320 372
             C 390 404 440 406 500 388
             L 500 480 L 20 480 Z"
          fill="url(#duneMid)"/>
    <path d="M 20 420 C 120 336 230 330 320 372"
          fill="none" stroke="#F2DFB6" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>

    <!-- front dune -->
    <path d="M 30 480
             C 140 420 300 408 480 452
             L 480 500 L 30 500 Z"
          fill="url(#duneFront)"/>
    <path d="M 30 480 C 140 420 300 408 480 452"
          fill="none" stroke="#F2DFB6" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- medallion rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#B99441" stroke-width="7"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#B99441" stroke-opacity="0.45" stroke-width="2.5"/>
</svg>
